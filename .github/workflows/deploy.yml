name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Injecte le numéro de build GitHub dans l'app (affiché sur /debug)
      - name: Inject build number
        run: echo "export const buildNumber = '${{ github.run_number }}';" > src/environments/build.generated.ts
      # Adapte le nom du dépôt après le / si besoin (base href pour GitHub Pages)
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages ne gère pas le routing côté serveur : on duplique index.html
      # en 404.html pour que les routes Angular (ex: /historique) fonctionnent au rechargement.
      - run: cp dist/workout/browser/index.html dist/workout/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/workout/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
