<div class="graph-wrap">
  <div class="graph" [style.gridTemplateColumns]="'repeat(' + totalCols + ', 11px)'">
    @for (m of monthLabels; track m.col) {
      <span
        class="month-label"
        [style.gridColumn]="m.col"
      >{{ m.name }}</span>
    }
  </div>

  <div class="graph-body">
    <div class="day-labels">
      @for (j of jours; track j) {
        <span>{{ j }}</span>
      }
    </div>
    <div class="grid" [style.gridTemplateColumns]="'repeat(' + totalCols + ', 11px)'">
      @for (cell of days; track cell.date) {
        <div
          class="cell"
          [class.empty]="!cell.date"
          [class.active]="cell.active"
          [class.future]="cell.isFuture"
          [class.today]="cell.isToday"
          [title]="tooltip(cell)"
        ></div>
      }
    </div>
  </div>

  <p class="muted total-line">{{ total }} séance(s) en {{ year }}</p>
</div>
