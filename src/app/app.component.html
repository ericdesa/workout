<div class="shell">
  <header class="topbar">
    <span class="logo">🏋️ Workout</span>
    <nav class="nav-desktop">
      <a routerLink="/accueil" routerLinkActive="active">Séance</a>
      @if (userEmail()) {
        <a routerLink="/reglages" routerLinkActive="active">Réglages</a>
      } @else {
        <a routerLink="/debug" routerLinkActive="active">Debug</a>
      }
    </nav>
    @if (userEmail()) {
      <div class="user-info">
        <span class="user-email">{{ userEmail() }}</span>
      </div>
    }
  </header>

  <main class="content">
    <router-outlet />
  </main>

  <nav class="nav-mobile">
    <a routerLink="/accueil" routerLinkActive="active">
      <span class="icon">🏠</span><span>Séance</span>
    </a>
    @if (userEmail()) {
      <a routerLink="/reglages" routerLinkActive="active">
        <span class="icon">⚙️</span><span>Réglages</span>
      </a>
    } @else {
      <a routerLink="/debug" routerLinkActive="active">
        <span class="icon">🔧</span><span>Debug</span>
      </a>
    }
  </nav>
</div>
