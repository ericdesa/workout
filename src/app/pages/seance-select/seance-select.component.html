<h1>Bon entraînement !</h1>

<button type="button" class="start-btn" (click)="nouvelleSeance()">
  <span class="start-title">Nouvelle séance</span>
  <span class="start-sub">Débuter une séance d'aujourd'hui</span>
</button>

@if (dernieresSessions().length) {
  <div class="card">
    <h3>Dernières séances</h3>
    @for (s of dernieresSessions(); track s.id) {
      <a class="recent-row" [routerLink]="['/session', s.id]">
        <span class="date">{{ dateCourte(s.date) }}</span>
        <span class="muted">{{ s.exercices.length }} exercice(s)</span>
        @if (s.exercices[0]) {
          <span class="first-ex">{{ s.exercices[0].exerciceNom }}</span>
        }
      </a>
    }
  </div>
}
