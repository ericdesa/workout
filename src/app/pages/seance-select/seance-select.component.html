<h1>Quelle séance aujourd'hui ?</h1>
<p>Suggestion basée sur ta rotation A → B → C.</p>

<div class="seance-grid">
  <button
    *ngFor="let s of program"
    type="button"
    class="seance-card"
    [class.suggested]="s.code === suggestion()"
    (click)="demarrer(s.code)"
  >
    <span class="code">{{ s.code }}</span>
    <span class="label">{{ s.label }}</span>
    <span class="count">{{ s.exercices.length }} exercices</span>
    <span class="badge" *ngIf="s.code === suggestion()">Suggérée</span>
  </button>
</div>

<div class="card" *ngIf="dernieresSessions().length">
  <h3>Dernières séances</h3>
  <a
    class="recent-row"
    *ngFor="let s of dernieresSessions()"
    [routerLink]="['/session', s.id]"
  >
    <span class="pill">{{ s.seanceCode }}</span>
    <span>{{ dateCourte(s.date) }}</span>
    <span class="muted">{{ s.exercices.length }} exercices notés</span>
  </a>
</div>
