<div class="page-header">
  <h1>Programme</h1>
  <div class="header-actions" *ngIf="!editing()">
    <button type="button" class="btn" (click)="startEditing()">
      ✏️ Modifier
    </button>
  </div>
  <div class="header-actions" *ngIf="editing()">
    <button
      type="button"
      class="btn btn-primary"
      (click)="save()"
      [disabled]="saving()"
    >
      {{ saving() ? "Enregistrement…" : "✓ Enregistrer" }}
    </button>
    <button type="button" class="btn" (click)="cancelEditing()">Annuler</button>
    <button type="button" class="btn btn-danger" (click)="resetToDefault()">
      Réinitialiser
    </button>
  </div>
</div>

<div
  class="card"
  *ngFor="let s of editing() ? draft() : program; let si = index"
>
  <h2>{{ s.label }}</h2>

  <table class="prog-table">
    <thead>
      <tr>
        <th *ngIf="editing()"></th>
        <th>Exercice</th>
        <th>Séries</th>
        <th>Reps</th>
        <th>Repos</th>
        <th *ngIf="editing()"></th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let ex of s.exercices; let ei = index; trackBy: trackByIndex"
        [class.draggable]="editing()"
        [attr.draggable]="editing() ? 'true' : null"
        (dragstart)="onDragStart($event, si, ei)"
        (dragend)="onDragEnd($event)"
        (dragover)="onDragOver($event, si, ei)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event, si, ei)"
      >
        <ng-container *ngIf="editing(); else viewMode">
          <td class="col-handle">
            <span class="grip">⠿</span>
          </td>
          <td class="edit-name">
            <input
              type="text"
              [ngModel]="ex.nom"
              (ngModelChange)="updateExercise(si, ei, 'nom', $event)"
            />
            <select
              [ngModel]="ex.type ?? 'musculation'"
              (ngModelChange)="updateExercise(si, ei, 'type', $event)"
            >
              <option value="musculation">Musculation</option>
              <option value="cardio">Cardio</option>
            </select>
          </td>
          <td>
            <input
              type="number"
              min="1"
              [ngModel]="ex.series"
              (ngModelChange)="updateExercise(si, ei, 'series', +$event)"
              class="num-input"
            />
          </td>
          <td>
            <input
              type="text"
              [ngModel]="ex.repsLabel"
              (ngModelChange)="updateExercise(si, ei, 'repsLabel', $event)"
              class="text-input"
            />
          </td>
          <td>
            <input
              type="text"
              [ngModel]="ex.reposLabel"
              (ngModelChange)="updateExercise(si, ei, 'reposLabel', $event)"
              class="text-input"
            />
          </td>
          <td class="col-action">
            <button
              type="button"
              class="icon-btn danger"
              (click)="removeExercise(si, ei)"
              aria-label="Supprimer"
            >
              ✕
            </button>
          </td>
        </ng-container>
        <ng-template #viewMode>
          <td>{{ ex.nom }}</td>
          <td>{{ ex.series }}</td>
          <td>{{ ex.repsLabel }}</td>
          <td>{{ ex.reposLabel }}</td>
        </ng-template>
      </tr>
    </tbody>
  </table>

  <button
    type="button"
    class="btn add-ex"
    *ngIf="editing()"
    (click)="addExercise(si)"
  >
    + Ajouter un exercice
  </button>
</div>

<div class="card">
  <h3>Règles de progression</h3>
  <dl class="regles">
    <ng-container *ngFor="let r of regles">
      <dt>{{ r.titre }}</dt>
      <dd>{{ r.texte }}</dd>
    </ng-container>
  </dl>
</div>

<p class="message" *ngIf="message()">{{ message() }}</p>
